# Publikuje katalog `site/` na GitHub Pages.
#
# Zrodlem jest workflow, a nie galaz z katalogiem: dzieki temu strona moze stac
# w `site/`, a dokumentacja projektu zostaje w `docs/` — bez mieszania jednego
# z drugim i bez przetwarzania przez Jekylla.
name: Strona

on:
  push:
    branches: ["claude/kodowanie-projektu-vuxkes"]
    paths:
      - "site/**"
      - ".github/workflows/strona.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jedno wdrozenie naraz. Nie przerywamy trwajacego — strona ma byc spojna.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publikuj:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.wdrozenie.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Bez `enablement: true` — token workflow nie ma prawa **wlaczyc** Pages
      # (API zwraca „Resource not accessible by integration"). Wlacza je raz
      # wlasciciel repozytorium: Settings → Pages → Source: GitHub Actions.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: wdrozenie
        uses: actions/deploy-pages@v4
